syntax = "proto3";
package zerone.emergency.v1;

option go_package = "github.com/zerone-chain/zerone/x/emergency/types";

import "google/api/annotations.proto";
import "zerone/emergency/v1/types.proto";
import "zerone/emergency/v1/genesis.proto";

// Query defines the emergency module's query service.
service Query {
  rpc Status(QueryStatusRequest) returns (QueryStatusResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/status";
  }
  rpc ActiveCeremony(QueryActiveCeremonyRequest) returns (QueryActiveCeremonyResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/ceremonies/active";
  }
  rpc CompletedCeremonies(QueryCompletedCeremoniesRequest) returns (QueryCompletedCeremoniesResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/ceremonies/completed";
  }
  rpc AuditLog(QueryAuditLogRequest) returns (QueryAuditLogResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/audit";
  }
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/params";
  }
  rpc ProtocolHealth(QueryProtocolHealthRequest) returns (QueryProtocolHealthResponse) {
    option (google.api.http).get = "/zerone/emergency/v1/health";
  }
}

message QueryStatusRequest {}
message QueryStatusResponse {
  string status = 1;
  bool is_halted = 2;
  string active_halt_ceremony_id = 3;
}

message QueryActiveCeremonyRequest {}
message QueryActiveCeremonyResponse {
  EmergencyCeremony ceremony = 1;
  bool found = 2;
}

message QueryCompletedCeremoniesRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}
message QueryCompletedCeremoniesResponse {
  repeated EmergencyCeremony ceremonies = 1;
  uint64 total = 2;
}

message QueryAuditLogRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}
message QueryAuditLogResponse {
  repeated EmergencyAuditEntry entries = 1;
  uint64 total = 2;
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}

// QueryProtocolHealthRequest has no parameters — returns live chain health snapshot.
message QueryProtocolHealthRequest {}

// QueryProtocolHealthResponse is a leading-indicator health snapshot for
// monitoring dashboards and auto-halt condition evaluation (Circuit Breakers Gap 3).
//
// Fields sourced from emergency module state only — no cross-module queries.
// Future: extend with active_rounds_ratio (knowledge) and slash_rate (staking).
message QueryProtocolHealthResponse {
  // emergency_status: current chain status (normal/halt_voting/halted/…)
  string emergency_status = 1;
  // oracle_freshness_blocks: blocks elapsed since last oracle/TWAP update.
  // 0 means oracle has never been updated or tracking is disabled.
  uint64 oracle_freshness_blocks = 2;
  // oracle_staleness_threshold: circuit_oracle_staleness_blocks param (0 = disabled).
  uint64 oracle_staleness_threshold = 3;
  // is_oracle_stale: true iff oracle_freshness_blocks > oracle_staleness_threshold > 0.
  bool is_oracle_stale = 4;
  // halt_start_block: the block at which the current halt began (0 if not halted).
  uint64 halt_start_block = 5;
  // blocks_since_halt: blocks elapsed since the halt started (0 if not halted).
  uint64 blocks_since_halt = 6;
  // max_halt_duration_blocks: governance-configured halt cap (0 = no cap).
  uint64 max_halt_duration_blocks = 7;
  // circuit_breakers_enabled: whether automatic circuit breakers are active.
  bool circuit_breakers_enabled = 8;
  // snapshot_block_height: the block at which this snapshot was taken.
  uint64 snapshot_block_height = 9;
}

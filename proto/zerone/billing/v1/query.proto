syntax = "proto3";
package zerone.billing.v1;

option go_package = "github.com/zerone-chain/zerone/x/billing/types";

import "google/api/annotations.proto";
import "zerone/billing/v1/types.proto";
import "zerone/billing/v1/genesis.proto";

// Query defines the billing module query service.
service Query {
  rpc Provider(QueryProviderRequest) returns (QueryProviderResponse) {
    option (google.api.http).get = "/zerone/billing/v1/providers/{address}";
  }
  rpc Providers(QueryProvidersRequest) returns (QueryProvidersResponse) {
    option (google.api.http).get = "/zerone/billing/v1/providers";
  }
  rpc Quote(QueryQuoteRequest) returns (QueryQuoteResponse) {
    option (google.api.http).get = "/zerone/billing/v1/quotes/{fact_id}";
  }
  rpc BatchQuote(QueryBatchQuoteRequest) returns (QueryBatchQuoteResponse) {
    option (google.api.http).get = "/zerone/billing/v1/quotes/batch";
  }
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/zerone/billing/v1/params";
  }
  rpc ZRNPriceUSD(QueryZRNPriceUSDRequest) returns (QueryZRNPriceUSDResponse) {
    option (google.api.http).get = "/zerone/billing/v1/price";
  }
  // ProtocolReserves returns a unified snapshot of all protocol fund balances.
  // Governance participants use this to assess the protocol's financial health
  // before making spending or emission decisions. Treasury Gap 5.
  rpc ProtocolReserves(QueryProtocolReservesRequest) returns (QueryProtocolReservesResponse) {
    option (google.api.http).get = "/zerone/billing/v1/reserves";
  }
}

message QueryProviderRequest {
  string address = 1;
}
message QueryProviderResponse {
  Provider provider = 1;
}

message QueryProvidersRequest {}
message QueryProvidersResponse {
  repeated Provider providers = 1;
}

message QueryQuoteRequest {
  string fact_id = 1;
}
message QueryQuoteResponse {
  QueryQuote quote = 1;
}

message QueryBatchQuoteRequest {
  repeated string fact_ids = 1;
}
message QueryBatchQuoteResponse {
  repeated QueryQuote quotes = 1;
  string total_price         = 2;
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}

message QueryZRNPriceUSDRequest {}
message QueryZRNPriceUSDResponse {
  string price_usd = 1;  // 6-decimal USD string
  string source    = 2;  // "manual", "twap", or "unavailable"
}

// QueryProtocolReservesRequest has no parameters — returns current live balances.
message QueryProtocolReservesRequest {}

// QueryProtocolReservesResponse aggregates all protocol fund balances.
// All amounts are in uzrn (bigint strings). 0 means the account is empty or not yet seeded.
message QueryProtocolReservesResponse {
  // treasury_protocol_uzrn: billing module's protocol treasury ("treasury_protocol" account).
  // Primary destination for billing revenue split protocol share.
  string treasury_protocol_uzrn  = 1;

  // protocol_treasury_uzrn: knowledge/toolbox protocol treasury ("protocol_treasury" account).
  // Secondary protocol treasury receiving knowledge review fee splits.
  // NOTE: "treasury_protocol" and "protocol_treasury" are distinct accounts — this is a
  // known naming inconsistency in the billing vs. knowledge routing paths.
  string protocol_treasury_uzrn  = 2;

  // research_fund_uzrn: research fund module account ("research_fund").
  // Funded by billing distribution and vesting_rewards research allocation.
  string research_fund_uzrn      = 3;

  // development_fund_uzrn: development fund ("development_fund").
  // Primary discretionary spending pool; gated by MsgDevelopmentFundSpend governance proposals.
  string development_fund_uzrn   = 4;

  // vindication_escrow_uzrn: knowledge module vindication escrow ("vindication_escrow").
  // Holds slashed verifier tokens that may be returned if their minority verdict is later correct.
  string vindication_escrow_uzrn = 5;

  // knowledge_pool_uzrn: knowledge module account ("knowledge").
  // Probe bounty pool and round fee accumulator.
  string knowledge_pool_uzrn     = 6;

  // disputes_escrow_uzrn: disputes module account ("disputes").
  // Holds challenger and defender bonds locked during active dispute proceedings.
  string disputes_escrow_uzrn    = 7;

  // snapshot_block_height: chain height at which all balances were read.
  uint64 snapshot_block_height   = 8;
}

syntax = "proto3";
package zerone.knowledge.v1;

option go_package = "github.com/zerone-chain/zerone/x/knowledge/types";

import "zerone/knowledge/v1/types.proto";

// Params are the governance parameters for the knowledge module.
// All BPS values use a 1,000,000 scale (1,000,000 = 100%).
message Params {
  // ─── Core verification ───────────────────────────────────────────────────
  uint64 min_verifiers            = 1;  // default: 3
  uint64 max_verifiers            = 2;  // default: 22
  uint64 commit_phase_blocks      = 3;  // default: 4
  uint64 reveal_phase_blocks      = 4;  // default: 4
  uint64 aggregation_phase_blocks = 5;  // default: 3
  uint64 claim_cooldown_blocks    = 6;  // default: 50

  // ─── Confidence scoring ──────────────────────────────────────────────────
  uint64 initial_confidence               = 7;  // default: 500,000 (50%)
  uint64 confidence_boost_per_verification = 8;  // default: 50,000  (5%)
  uint64 confidence_threshold             = 9;  // default: 770,000 (77%) acceptance
  uint64 quorum_threshold                 = 10; // default: 660,000 (66%)

  // ─── Slashing — MUST be non-zero (B22-3 audit) ──────────────────────────
  uint64 wrong_verification_slash_bps = 11; // default: 50,000  (5%)
  uint64 missed_reveal_slash_bps      = 12; // default: 100,000 (10%)
  uint64 equivocation_slash_bps       = 13; // default: 200,000 (20%)
  uint64 invalid_claim_slash_bps      = 14; // DEPRECATED (R19-6): no longer used — review fee is non-refundable

  // ─── Rewards ─────────────────────────────────────────────────────────────
  string verification_reward           = 15; // default: "3000000" (3 ZRN in uzrn)
  uint64 verification_reward_decay_bps = 16; // default: 999,000 (0.999× per epoch)

  // ─── Claim validation ────────────────────────────────────────────────────
  uint64 min_claim_text_length = 17; // default: 20
  uint64 max_claim_text_length = 18; // default: 10,000
  string min_review_fee        = 19; // default: "100000" (0.1 ZRN) — non-refundable review fee

  // ─── Adversarial verification ────────────────────────────────────────────
  bool   adversarial_verification_enabled = 20; // default: true
  uint64 provisional_threshold            = 21; // default: 500,000 (50%)
  uint64 reject_threshold                 = 22; // default: 300,000 (30%)
  uint64 challenge_duration_blocks        = 23; // default: 34,272 (1 day)
  string min_challenge_stake              = 24; // default: "11000000" (11 ZRN)
  uint64 failed_challenge_slash_bps       = 25; // default: 220,000 (22%)
  uint64 successful_challenge_reward_bps  = 26; // default: 300,000 (30%)
  uint64 max_concurrent_challenges        = 27; // default: 3

  // ─── Citation economics ──────────────────────────────────────────────────
  uint64 citation_share_bps    = 28; // default: 150,000 (15%)
  uint64 cross_domain_bonus_bps = 29; // default: 200,000 (20%)

  // ─── Extended governance params ─────────────────────────────────────────
  uint64 max_facts_per_domain        = 30; // default: 100,000
  uint64 fact_expiry_blocks          = 31; // default: 0 (no expiry)
  uint64 cross_stratum_discount_bps  = 32; // default: 0
  uint64 novelty_bonus_bps           = 33; // default: 0
  uint64 max_validators_per_round    = 34; // default: 22
  uint64 max_citations_per_claim     = 35; // default: 50
  uint64 citation_decay_per_level    = 36; // default: 500,000 (50% per ancestor level)
  uint64 self_citation_discount_bps  = 37; // default: 500,000 (50%)
  uint64 confidence_growth_epoch     = 38; // default: 1,111 blocks
  uint64 confidence_growth_per_epoch_bps = 39; // default: 11,000 (1.1%)
  uint64 max_survival_confidence     = 40; // default: 770,000 (77%)
  uint64 survived_challenge_confidence_cap = 41; // default: 880,000 (88%)
  uint64 max_apprentice_validators   = 42; // default: 111 (Sybil cap)

  // ─── FARM anti-gaming params ─────────────────────────────────────────────
  uint64 conformity_threshold_bps          = 43; // default: 950,000 (FARM-1)
  uint64 calibration_trivial_threshold     = 44; // default: 950,000 (FARM-2)
  uint64 misbehavior_rejection_threshold   = 45; // default: 300,000 (FARM-6)
  uint64 min_domain_contributors_for_novelty = 46; // default: 3 (FARM-7)
  uint64 min_participation_rate_bps        = 47; // default: 500,000 (FARM-8)
  uint64 challenge_stake_ratio_min_bps     = 48; // default: 500,000 (FARM-9)

  // ─── Research fund ───────────────────────────────────────────────────────
  uint64 research_fund_share_bps = 49; // default: 130,000 (13%)

  // ─── Malformed claim slashing ──────────────────────────────────────────
  uint64 malformed_claim_slash_bps = 50; // default: 500,000 (50%) — harsher than invalid_claim (22%)

  // ─── Fitness scoring ─────────────────────────────────────────────────────
  uint64 fitness_epoch_blocks        = 51;  // Blocks per fitness epoch
  uint64 fitness_weight_query_bps    = 52;  // Weight for query rate
  uint64 fitness_weight_citation_bps = 53;  // Weight for citation rate
  uint64 fitness_weight_bridge_bps   = 54;  // Weight for bridge score
  uint64 fitness_weight_depth_bps    = 55;  // Weight for dependency depth
  uint64 fitness_weight_patron_bps   = 56;  // Weight for active patronage
  uint64 fitness_weight_unique_bps   = 57;  // Weight for uniqueness
  uint64 fitness_weight_age_bps      = 58;  // Weight for age penalty
  uint64 fitness_initial_score       = 59;  // Score assigned at birth (grace period)
  uint64 fitness_grace_epochs        = 60;  // Epochs before age penalty kicks in

  // ─── Bootstrap fund (R19-7) ────────────────────────────────────────────
  bool   bootstrap_fund_enabled         = 61; // Whether sponsored claims are accepted
  string bootstrap_fund_max_per_address = 62; // Max sponsored claims per address (lifetime)
  string bootstrap_fund_max_per_epoch   = 63; // Max sponsored claims per epoch (rate limit)
  uint64 bootstrap_fund_epoch_blocks    = 64; // Epoch length in blocks for rate limiting
  string bootstrap_fund_fee_cap         = 65; // Max fee the fund will cover per claim (uzrn)

  // ─── Metabolism ──────────────────────────────────────────────────────────
  uint64 metabolism_base_cost                = 66;  // Base energy drain per epoch
  uint64 metabolism_content_length_bps       = 67;  // Additional cost per 100 chars of content (BPS of base)
  uint64 metabolism_domain_competition_bps   = 68;  // Additional cost per 100 facts in domain (BPS of base)
  uint64 metabolism_energy_per_query         = 69;  // Energy gained per query
  uint64 metabolism_energy_per_citation      = 70;  // Energy gained per new citation
  uint64 metabolism_energy_per_patronage     = 71;  // Energy gained per patronage epoch
  uint64 metabolism_energy_challenge_survival = 72; // One-time energy for surviving challenge
  uint64 metabolism_energy_cap               = 73;  // Maximum energy a fact can hold
  uint64 metabolism_initial_energy           = 74;  // Starting energy for new facts
  uint64 metabolism_at_risk_epochs           = 75;  // Epochs at 0 energy before expiry
  uint64 metabolism_expired_to_pruned_epochs = 76;  // Epochs after expiry before pruning

  // ─── Reproduction ────────────────────────────────────────────────────
  uint64 reproduction_royalty_bps                   = 77;  // Royalty to parent per child reward epoch
  uint64 reproduction_royalty_decay_bps             = 78;  // Decay per generation (BPS of previous)
  uint64 reproduction_max_royalty_depth             = 79;  // Max generations for royalty propagation
  uint64 reproduction_parent_energy_bonus           = 80;  // Energy bonus to parent when child is created
  uint64 reproduction_child_fitness_inheritance_bps = 81;  // % of parent fitness inherited by child
  uint64 reproduction_max_children                  = 82;  // Max direct children per fact

  // ─── Novelty detection ──────────────────────────────────────────────────
  uint64 novelty_common_knowledge_penalty_bps = 83;  // Default penalty for common knowledge match
  uint64 novelty_subject_overlap_penalty_bps  = 84;  // Penalty per existing fact with same subject
  uint64 novelty_precision_bonus_bps          = 85;  // Bonus if more precise than existing
  uint64 novelty_cross_domain_bonus_bps       = 86;  // Bonus if subject spans multiple domains
  uint64 novelty_max_overlap_facts            = 87;  // Cap on overlap penalty (after N, no more penalty)

  // ─── Agent demand ────────────────────────────────────────────────
  uint64 demand_bounty_threshold         = 88;  // Unfulfilled queries per epoch to trigger bounty
  string demand_bounty_base_reward       = 89;  // Base bounty reward (uzrn)
  string demand_bounty_per_query_bonus   = 90;  // Additional reward per unfulfilled query (uzrn)
  uint64 demand_bounty_expiry_epochs     = 91;  // Epochs before unclaimed bounty expires
  uint64 demand_multiplier_cap           = 92;  // Max demand multiplier for energy (BPS)
  bool   demand_tracking_enabled         = 93;  // Enable/disable demand tracking
  repeated string authorized_demand_reporters = 94; // Addresses allowed to report demand

  // ─── Competition (niche dynamics) ──────────────────────────────────
  uint64 competition_niche_dominance_bonus_bps = 95;  // Fitness bonus for niche leader (BPS)
  uint64 competition_redundancy_threshold_bps  = 96;  // Below this ratio of leader fitness = redundant (BPS)
  uint64 competition_max_niche_size            = 97;  // Max facts per niche before forced pruning
  uint64 competition_symbiosis_bonus_bps       = 98;  // Fitness bonus per SUPPORTS link to healthy fact (BPS)

  // ─── Query satisfaction ──────────────────────────────────────────────
  uint64 fitness_weight_satisfaction_bps = 99;  // Weight of satisfaction in fitness (default: 150,000 = 15%)
  uint64 satisfaction_min_ratings        = 100; // Minimum ratings before satisfaction affects fitness (default: 3)

  // ─── Consensus diversity (R28-2) ──────────────────────────────────
  uint64 diversity_conformity_alert_threshold = 101; // BPS entropy below which a domain is "conforming" (default: 50,000 = 5%)
  uint64 diversity_conformity_alert_epochs    = 102; // Consecutive low-diversity epochs before alert (default: 3)

  // ─── Retroactive vindication (R28-1) ──────────────────────────────
  bool   vindication_refund_enabled  = 103; // Master switch for vindication escrow (default: true)
  uint64 vindication_bonus_bps       = 104; // % of majority slash pool as bonus to vindicated minority (default: 2000 = 20%)
  uint64 vindication_slash_bps       = 105; // Slash rate for majority on disproven fact (default: 500 = 5%)
  uint64 vindication_window_blocks   = 106; // How long escrowed entries are eligible (default: 100000)

  // ─── Multi-level energy thresholds (R28-4) ──────────────────────────
  uint64 metabolism_active_threshold     = 107; // Energy below which fact → AT_RISK (default: 300,000 = 30%)
  uint64 metabolism_extinction_threshold = 108; // Energy below which (for N epochs) → EXTINCT (default: 10,000 = 1%)
  uint64 max_confidence                  = 109; // Hard cap on confidence (default: 880,000 = 88%)

  // ─── Role bonuses (R28-5) ──────────────────────────────────────────────
  uint64 human_empirical_bonus_bps     = 110; // +15% confidence for human OBSERVATION claims (BPS)
  uint64 agent_computational_bonus_bps = 111; // +15% confidence for agent COMPUTATIONAL claims (BPS)
  uint64 agent_verification_bonus_bps  = 112; // +20% vote weight for agent verifiers (BPS)
  uint64 human_patronage_bonus_bps     = 113; // +10% energy boost for human patrons (BPS)
  uint64 dual_validation_bonus_bps     = 114; // +25% confidence for partnership claims (BPS)

  // ─── Domain carrying capacity (R29-1) ──────────────────────────────────
  uint64 domain_base_capacity              = 115; // Base facts per domain before pressure kicks in (default: 1000)
  uint64 domain_capacity_growth_per_citation = 116; // Capacity bonus per inbound cross-domain citation (default: 1)
  uint64 overcrowding_decay_multiplier_bps = 117; // Decay multiplier at 2× capacity (default: 1,500,000 = 150%)
  uint64 underpopulation_birth_bonus_bps   = 118; // Energy bonus for facts in sparse domains (default: 200,000 = 20%)

  // ─── Epistemic temperature (R29-2) ──────────────────────────────────
  uint64 epistemic_temperature_decay_bps        = 119; // Per-epoch decay toward neutral (default: 995,000 = 99.5%)
  uint64 epistemic_conformity_cooling_bps       = 120; // Cooling per high-conformity epoch (default: 50,000 = 5%)
  uint64 epistemic_vindication_heating_bps      = 121; // Heating per vindication event (default: 100,000 = 10%)
  uint64 epistemic_cold_confidence_cap_bps      = 122; // Max confidence in cold domains (default: 600,000 = 60%)
  uint64 epistemic_hot_confidence_growth_bps    = 123; // Confidence growth multiplier in hot domains (default: 1,500,000 = 150%)
  uint64 epistemic_temperature_window_blocks    = 124; // Lookback window for vindication counting (default: 10,000)

  // ─── Domain role elasticity (R29-3) ──────────────────────────────────
  uint64 role_elasticity_min_calls          = 125; // Min calls per role before elasticity activates (default: 10)
  uint64 role_elasticity_max_multiplier_bps = 126; // Max bonus scaling (default: 2,000,000 = 200%)
  uint64 role_elasticity_min_multiplier_bps = 127; // Min bonus scaling (default: 500,000 = 50%)
  uint64 role_elasticity_decay_epochs       = 128; // Blocks between 5% decay cycles (default: 100)

  // ─── Mentorship dividends (R31-5: Water → Wood) ──────────────────────
  uint64 mentorship_dividend_energy   = 129; // Energy added to domain on mentorship graduation (default: 50,000)
  uint64 mentorship_capacity_bonus    = 130; // Carrying capacity bonus per graduation (default: 5)

  // ─── Social verification adjustment (R31-2: Water → Fire) ──────────────
  uint64 social_saturation_threshold = 131; // Partnership density above which verification relaxes (default: 10)
  uint64 observation_window_blocks   = 132; // Lookback window for verification health metrics (default: 10000)

  // ─── Consensus integrity (T1 mitigation) ────────────────────────────────
  // Minimum distinct verifier headcount that must vote with the verdict, in
  // addition to the stake-weighted ConfidenceThreshold. Prevents a single
  // large-stake coalition from promoting claims past consensus.
  uint64 min_headcount_agreement = 133; // default: 3

  // ─── Popperian challenge stake (Wave 14c: stress-test, don't shield) ────
  // Effective MinChallengeStake = base × max(floor, 1 - target.Confidence ×
  // scaling / BPS). Scales INVERSELY with target confidence: the more the
  // community trusts a claim, the cheaper it is to probe it. Truth stands
  // firm under challenge because of its nature — the chain invites the
  // testing of high-confidence facts rather than taxing it.
  // See keeper.ChallengeStakeFloorBps (10% floor) for the spam guard.
  uint64 challenge_confidence_scaling_bps = 134; // default: 1,000,000 (full inversion)

  // ─── Schelling-point mitigation (T3) ────────────────────────────────────
  // Verifier reward is multiplied by (1 - conformity_bps × strength / BPS²)
  // so crowd-followers earn less than independent investigators.
  // Score source: ValidatorIndependenceScore in x/knowledge/keeper/diversity.go.
  uint64 independence_reward_strength_bps = 135; // default: 300,000 (max 30% reward reduction)

  // ─── Route B Wave 4: economic realignment ───────────────────────────────
  // Reformulation rounds: how many verifier votes before a verdict is final.
  uint64 reformulation_min_panel_votes = 136; // default: 3
  // Fraction of verifiers that must agree to finalize a non-pending verdict.
  uint64 reformulation_consensus_bps   = 137; // default: 666,000 (66.6%)
  // SUPERIOR verdict bonus as a multiplier of reward_per_variant.
  uint64 reformulation_superior_bonus_bps = 138; // default: 500,000 (50% bonus)
  // Percentage of remaining-bounty escrow charged as a "kept-market-open"
  // fee when the sponsor cancels or the bounty expires with unspent escrow.
  uint64 augmentation_expiry_fee_bps = 139; // default: 30,000 (3%)
  // Methodology normalization table. Keys are methodology_id strings in the
  // Methodology registry; values are multipliers in BPS applied to TVW so
  // methodologies with naturally-low corroboration don't get starved.
  // Absent keys → 1,000,000 (1.0×). Set at genesis.
  map<string, uint64> methodology_normalization_bps = 140;
  // Vindication multiplier — facts vindicated from minority status get this
  // fraction × TVW. >1.0× rewards epistemic courage.
  uint64 vindication_tvw_multiplier_bps = 141; // default: 2,500,000 (2.5×)
  // Disproval clawback — after a fact goes DISPROVEN, this fraction of the
  // recent training revenue is clawed back from the submitter into the
  // research fund.
  uint64 disproval_clawback_bps = 142; // default: 500,000 (50%)
  uint64 disproval_clawback_window_epochs = 143; // default: 30
  // Training-fund post-hoc disbursement params.
  uint64 training_fund_calibration_floor_bps = 144; // default: 500,000 (50%) — below = no disbursement
  uint64 training_fund_vesting_epochs        = 145; // default: 60
  uint64 training_fund_methodology_diversity_bonus_bps = 146; // default: 100,000 per distinct method beyond 1
  string training_fund_base_reward          = 147; // default: "1000000000" (1,000 ZRN in uzrn)
  // Contribution challenge — challenger bond size (uzrn as string).
  string contribution_challenge_bond        = 148; // default: "5000000" (5 ZRN)
  uint64 contribution_challenge_reward_multiplier_bps = 149; // default: 2,000,000 (winner takes bond × 2)
  // Sponsor-veto forfeiture: if a sponsor vetoes a passing verdict, they
  // forfeit this fraction of the variant payout to the research fund.
  uint64 sponsor_veto_forfeit_bps = 150; // default: 1,000,000 (100% — full forfeiture)

  // ─── Wave 14: internal-hack resilience ───────────────────────────────
  // Upper bound on any single module pause window. Even if authority
  // sets auto_unpause_at_block=0 (intending indefinite), the handler
  // caps it to this many blocks from pause-time. Forces compromised
  // authority's DoS to self-resolve within a governance-configured
  // window rather than persisting indefinitely.
  uint64 max_pause_duration_blocks = 151; // default: 28,800 (~40h at 5s blocks)

  // ─── Wave 15: chain-driven stress-test invitation ──────────────────────
  // Truth stands firm under challenge because of its nature — and the
  // chain no longer waits for challenges to arrive. A per-block heartbeat
  // scans for high-confidence facts that have gone idle (no challenge in
  // threshold blocks) and emits invitation events, signaling to external
  // prober agents that the substrate is actively seeking stress-tests of
  // those claims. The chain manufactures demand for its own audit.
  uint64 probe_invitation_idle_threshold_blocks = 152; // default: 34,272 (~1 day at 2.5s blocks)
  uint64 probe_invitation_min_confidence_bps    = 153; // default: 700,000 (70%) — only invite probes on facts worth testing
  uint32 probe_invitation_batch_size            = 154; // default: 10 — max invitations emitted per block (bounds BeginBlocker work)
  uint64 probe_invitation_reinvite_cooldown     = 155; // default: 100_000 blocks — don't re-invite the same fact back-to-back

  // ─── Wave 15: probe bounty pool ───────────────────────────────────────
  // A purpose-built minting stream that funds probe rewards. Moves
  // epistemic-auditing funding out of general governance (protocol
  // treasury) into a dedicated pool so the chain self-sustains its own
  // audit economy. successful-probe bonuses draw from this pool first;
  // if the pool is empty, fall back to protocol treasury.
  string probe_bounty_mint_per_block = 156; // uzrn minted per block (default "1000000" = 1 ZRN)
  string probe_bounty_max_pool_size  = 157; // cap on pool balance (default "1000000000000" = 1,000,000 ZRN)

  // ─── Wave 15b: invitation bonuses ──────────────────────────────────────
  // When a prober acts on a fact the chain has explicitly invited for
  // stress-testing, pay them a flat bonus from the probe bounty pool
  // regardless of outcome. Converts invitations from demand signals
  // into standing offers — the chain isn't just saying "please probe
  // this", it's saying "here's uzrn waiting for whoever does."
  // Paid in addition to stake refund, participation reward, and
  // success amplification.
  string invitation_bonus_amount = 158; // default "500000" = 0.5 ZRN per answered invitation

  // ─── Wave 16: guardian-veto window ────────────────────────────────────
  // The privileged-action log made authority abuse queryable; the
  // guardian-veto window makes it preventable. The set of addresses
  // listed in guardian_addresses can VETO authority-gated fact
  // injection during the time window between proposal and
  // materialization. Closes the persistent-authority-compromise gap
  // documented in Wave 14: the chain no longer relies on a single key
  // for actions that bypass the verifier panel.
  //
  // The single authority can still propose actions cheaply; legitimate
  // operations are not blocked. But any one of the configured
  // guardians can cancel a malicious or mistaken proposal during the
  // veto window. Trust shifts from "the authority key is honest" to
  // "no individual can unilaterally inject untruth."
  repeated string guardian_addresses              = 159; // veto-eligible addresses; empty = no guardian set, immediate execution
  uint64 add_fact_veto_window_blocks              = 160; // default 0 (immediate); set > 0 to enable veto window

  // ─── Fee markets: congestion-based backpressure (Gap 1) ───────────────
  // When the number of active verification rounds exceeds
  // congestion_threshold_rounds, the effective minimum review fee is
  // scaled up by congestion_multiplier_bps per excess round (BPS scale,
  // 1,000,000 = 100%). This is EIP-1559-style backpressure applied to
  // claim submission: the price to enter verification rises as verifier
  // bandwidth thins, preventing quality degradation under heavy load.
  //
  // Formula:
  //   excess = active_rounds_count - congestion_threshold_rounds
  //   effectiveMinFee = baseMinFee × (1 + excess × multiplierBps / 1,000,000)
  //
  // Setting congestion_multiplier_bps = 0 disables congestion pricing
  // entirely (default). congestion_threshold_rounds = 0 also disables it.
  uint64 congestion_multiplier_bps    = 161; // default: 0 (disabled) — BPS increase per excess active round
  uint64 congestion_threshold_rounds  = 162; // default: 100 — active rounds above which backpressure activates

  // ─── Fee markets: governance-adjustable revenue split (Gap 3) ────────────
  // The review fee split was previously hardcoded in fees.go as compile-time
  // constants. Moving it into Params allows governance to adjust verifier
  // incentives without a code upgrade — for example, to increase verifier
  // share during bootstrap to attract more validators.
  //
  // Invariant: verifier_pool_bps + protocol_treasury_bps + development_fund_bps
  //            < 1,000,000 (so research fund always receives the remainder > 0).
  //
  // Default split (unchanged from hardcoded): 55% / 22% / 19.67% / ~3.33%.
  // Setting verifier_pool_bps = 0 disables the pool entirely (not recommended).
  uint64 verifier_pool_bps      = 163; // default: 550_000 (55%) — knowledge module holds for verifiers
  uint64 protocol_treasury_bps  = 164; // default: 220_000 (22%) → protocol_treasury module account
  uint64 development_fund_bps   = 165; // default: 196_700 (19.67%) → development_fund module account
  // research fund receives remainder (1_000_000 - burn_bps - the three above)

  // ─── Fee markets: fee burn (Gap 4) ────────────────────────────────────────
  // burn_bps sets the fraction of every review fee that is permanently burned
  // (removed from supply) before the remainder is split among verifiers,
  // protocol treasury, development fund, and research fund.
  //
  // This is the knowledge-market analogue of EIP-1559's base-fee burn:
  // the highest-volume fee collection point in the protocol now contributes
  // to supply contraction, complementing the MaxSupplyUzrn cap already enforced
  // for block rewards.
  //
  // Invariant: burn_bps + verifier_pool_bps + protocol_treasury_bps +
  //            development_fund_bps < 1_000_000
  // (research fund always receives a non-zero remainder)
  //
  // Default 0 = disabled. Governance activates by setting a non-zero value.
  uint64 burn_bps = 166; // default: 0 (disabled) — fraction of review fee burned

  // max_priority_tip_bps caps the priority_tip_bps a submitter may request in
  // MsgSubmitClaim (BPS, 1_000_000 = 100% of the verifier pool). Submissions
  // exceeding this are rejected with ErrPriorityTipExceedsMax.
  //
  // Default 0 = feature disabled entirely (all priority_tip_bps values are
  // rejected unless governance enables by setting a non-zero cap).
  // Governance can set to e.g. 100_000 (10%) to allow speed-premium bids
  // up to 10% of the verifier pool.
  uint64 max_priority_tip_bps = 167; // default: 0 (disabled)

  // Verifier independence pre-check gate (P-10a).
  //
  // min_verifier_independence_bps: minimum dissent fraction required before a
  // validator may join a verification panel. Measured as
  //   (minority_votes / total_votes) × 1_000_000.
  // A validator who always agrees with the majority scores 0; one who dissents
  // 10% of the time scores 100_000. Default 0 = gate disabled (all validators
  // eligible regardless of independence score). Enable via governance once
  // validators have sufficient vote history. Recommended value: 50_000 (5%).
  //
  // min_verifier_independence_rounds: minimum completed rounds a validator must
  // have before the independence gate applies. Protects new validators from
  // being excluded before they have vote history. Default 10.
  uint64 min_verifier_independence_bps    = 168; // default: 0 (disabled)
  uint64 min_verifier_independence_rounds = 169; // default: 10

  // min_round_duration_blocks enforces a minimum total round length for every
  // new VerificationRound. Checked at CreateVerificationRound time against
  // commit_phase_blocks + reveal_phase_blocks + aggregation_phase_blocks.
  // 0 = disabled (default). Enable via governance to enforce economic security
  // minimums: a very short round reduces the economic security of each verdict
  // because stake cycles too rapidly relative to potential manipulation profit.
  // (Settlement Finality Gap 2)
  uint64 min_round_duration_blocks = 170; // default: 0 (disabled)

  // Null-result credit (Scientific Method Gap 5 — Peirce's self-correcting community).
  // When a claim is REJECTED and its submitter had declared RefutationConditions
  // (Claim.refutation_conditions is non-empty), the submitter receives
  // null_result_credit_uzrn as compensation for contributing a testable claim
  // that turned out false. This corrects publication bias: submitters are no
  // longer penalised purely for being wrong; they are rewarded for being *correctly
  // wrong about something they were willing to test*. 0 = disabled (default).
  uint64 null_result_credit_uzrn = 171; // default: 0 (disabled)

  // proof_certificate_bypass_enabled (Formal Logic Gap 1 — Tier 0 verification).
  // When true, M-FORMAL claims that carry a PROOF_FORMAT_CANONICAL_CHAIN certificate
  // with all premise_fact_ids verified as accepted on-chain facts skip the
  // Proof-of-Truth panel and are auto-accepted at their declared confidence.
  // Default: false (all claims go through PoT until governance activates bypass
  // after the canonical certificate format is validated in production).
  bool proof_certificate_bypass_enabled = 172; // default: false

  // proper_scoring_rule_enabled (Calibrated Forecasting Gap 1).
  // When true, verifier reward shares within each correct-verifier pool are
  // proportional to the individual Brier correctness score computed from the
  // verifier's stated ConfidenceBps.  Higher confidence in a correct direction
  // → larger share; lower confidence → smaller (but still positive) share.
  // Verifiers who did not report ConfidenceBps (ConfidenceBps == 0) are treated
  // as if they reported 50% (BPS 500_000) — the maximum-uncertainty neutral
  // position — preserving backward compatibility for pre-Wave-4 reveals.
  // Default: false (equal-share distribution, existing behaviour).
  bool proper_scoring_rule_enabled = 173; // default: false

  // aggregation_extremizing_alpha (Calibrated Forecasting Gap 5).
  // Applies Tetlock's aggregate-extremizing formula to panel confidence scores
  // after stake-weighted vote aggregation but before stratum ceiling and the
  // global MaxConfidence cap.  Extremizing pushes the aggregate probability
  // away from 50%, correcting for the systematic under-confidence that
  // results from averaging independent probability estimates whose shared
  // evidence components have been double-counted.
  //
  // Formula: extremized = p^α / (p^α + (1−p)^α)
  // where p is the raw aggregate confidence (0..1) and α > 1 pushes away
  // from 0.5.  50% is the fixed point (extremizing 50% yields 50%).  Typical
  // GJP values: 1.5 (conservative), 2.0 (moderate), 2.5 (aggressive).
  //
  // Storage: milliunits — 1000 = α=1.0 (identity), 1500 = α=1.5, 2000 = α=2.0.
  // 0 = disabled (no extremizing, existing behaviour).
  // Only applied to binary verdicts (ACCEPT / REJECT); MALFORMED / INCONCLUSIVE
  // are left unchanged because they are not probability estimates.
  // Result is clamped by MaxConfidence and stratum ceilings as usual.
  uint64 aggregation_extremizing_alpha = 174; // default: 0 (disabled)

  // min_pragmatic_consequence_instances: minimum number of ConsequenceInstance records
  // required on an M-PRAGMATIC claim before the verification round can return an ACCEPT
  // verdict. When the panel votes ACCEPT but the track record is insufficient, the
  // verdict is overridden to VERDICT_INCONCLUSIVE. Default 0 = disabled (no gate).
  // Operationalizes the "at least N instances" requirement from M-PRAGMATIC's
  // ComplianceCriteria, closing the N-unspecified gap from the pragmatism brief.
  uint64 min_pragmatic_consequence_instances = 175; // default: 0 (disabled)

  // min_phenomenological_window_blocks: minimum number of blocks a verification
  // round must have been running before an M-PHENOMENOLOGICAL claim can receive
  // an ACCEPT verdict. When the panel votes ACCEPT but the round elapsed
  // (VerdictBlock - StartedAtBlock) is less than this threshold, the verdict is
  // overridden to VERDICT_INCONCLUSIVE, and a new round with a longer observation
  // window must be initiated. Default 0 = disabled (no minimum window).
  // Operationalizes the contemplative-traditions brief's temporal verification
  // requirement: claims about states requiring sustained observation (jhāna states,
  // phenomenological realization, attentional training effects) cannot be validly
  // assessed in a single-session flash panel.
  uint64 min_phenomenological_window_blocks = 176; // default: 0 (disabled)

  // min_panel_diversity_bps: minimum panel diversity score required for an ACCEPT
  // verdict. Panel diversity = (distinct_organizations / total_verifiers) × 1_000_000.
  // When the panel votes ACCEPT but diversity_score < min_panel_diversity_bps,
  // the verdict is overridden to VERDICT_INCONCLUSIVE — a new round must be
  // convened with a more organizationally diverse panel.
  // Default 0 = disabled (no diversity requirement). Governance can set this
  // per-chain or it can be enforced via Methodology.min_panel_diversity_bps.
  // Implements Scientific Method Gap 1: the replication crisis showed that
  // counting independent replications without verifying organizational independence
  // produces false confidence. Three verifiers from the same institution or
  // trained on the same corpus are not three independent assessments.
  uint64 min_panel_diversity_bps = 177; // default: 0 (disabled)

  // Scientific Method Gap 3: Submission Bias / Pre-registration.
  // Bond required to pre-register a claim intent (uzrn). Escrowed on
  // MsgPreRegisterClaim, returned on MsgSubmitClaim fulfillment, forfeited
  // to research_fund on expiry. 0 = disabled (no bond, no forfeiture).
  string pre_registration_bond_uzrn = 178; // default: "" (disabled)

  // How many blocks a pre-registration is valid before it expires.
  // If 0, pre-registrations never expire (bond held indefinitely until fulfilled).
  // Typical setting: 7200 blocks ≈ 12 hours at 6-second block time.
  uint64 pre_registration_expiry_blocks = 179; // default: 0 (no expiry)

  // Discount on the effective minimum review fee for pre-registered claims.
  // 0 = no discount. 100_000 = 10% off. Max 500_000 (50%).
  // Applied as: discounted_min = min * (1_000_000 - discount) / 1_000_000.
  uint64 pre_registration_discount_bps = 180; // default: 0 (no discount)

  // min_phenomenological_practice_hours: minimum declared practice hours required
  // for a verifier to join an M-PHENOMENOLOGICAL verification panel.
  // 0 = gate disabled (default). When > 0, verifiers whose AgentCalibration
  // .attentional_practice_hours is less than this threshold are rejected at
  // MsgSubmitCommitment with ErrInsufficientAttentionalPractice.
  //
  // Contemplative traditions brief: trained attention is an epistemic instrument
  // distinct from domain expertise. A jhāna-state phenomenology claim requires
  // verifiers who have cultivated the relevant attentional capacities — not just
  // verifiers who know what jhāna means. This param operationalizes Varela's
  // neurophenomenological requirement that research participants undergo attentional
  // training before conducting phenomenological experiments.
  //
  // Fail-open: 0 = gate disabled; verifiers with zero practice hours are eligible
  // for M-PHENOMENOLOGICAL panels under the same rules as all other panels.
  uint64 min_phenomenological_practice_hours = 181;

  // phenomenological_corroboration_confidence_bps: cross-modal corroboration gate
  // for M-PHENOMENOLOGICAL claims. When non-zero, an M-PHENOMENOLOGICAL ACCEPT
  // verdict at confidence >= this threshold is downgraded to INCONCLUSIVE unless
  // the claim has at least one ClaimRelation whose target fact carries method_id
  // "M-EMPIRICAL" (or any M-EMPIRICAL-family methodology). Operationalizes
  // Varela's neurophenomenological principle: high-confidence first-person claims
  // require third-person empirical grounding. The mutual constraint between
  // first-person description and third-person neural/behavioral data is the
  // chain's answer to the hard problem of verification (phenomenology-brief.md
  // Gap 3: cross-modal corroboration requirement, ★★★☆☆).
  //
  // Fail-open: 0 = gate disabled; M-PHENOMENOLOGICAL claims are accepted at any
  // confidence without requiring M-EMPIRICAL corroboration.
  uint64 phenomenological_corroboration_confidence_bps = 182;

  // oracle_freshness_window_blocks: number of recent blocks within which an
  // oracle_request_id embedded in MsgSubmitReveal must have been computed.
  // If non-zero, the chain maintains a ring buffer of recent block hashes and
  // verifies that the oracle was queried using a block hash from within this
  // window. Prevents verifiers from replaying stale oracle responses across
  // different claims or different time periods.
  //
  // The oracle request_id is: sha256(claim_id + "|" + hex(block_hash) + "|" + verifier_addr).
  // Verifiers include this in MsgSubmitReveal.oracle_request_id; the chain checks
  // that the embedded block_hash matches a stored hash from within the window.
  //
  // Fail-open: 0 = gate disabled (default). Non-empty oracle_request_id with a
  // zero window is ignored (field stored but not validated).
  // Oracle Resilience Brief Gap 4 (★★★★☆).
  uint64 oracle_freshness_window_blocks = 183;

  // transitive_relation_verbs: the set of relation verbs for which the
  // transitivity inference rule applies. When QueryDerivedConsequences is
  // called with a RELATION fact whose verb is in this list, the chain derives
  // relate(D, A, r, C) from relate(D, A, r, B) + relate(D, B, r, C).
  //
  // Governance-settable; defaults to ["is-a", "implies", "causes",
  // "is-part-of"]. Empty list disables transitivity derivation entirely.
  // Formal Logic Brief Gap 4 (★★★☆☆).
  repeated string transitive_relation_verbs = 184;

  // constraint_check_enabled: when true, MsgSubmitClaim detects assert/negate
  // canonical form contradictions against existing verified facts.
  //
  // On contradiction: Claim.conflicting_fact_id is set to the opposing fact ID
  // and event zerone.knowledge.constraint_violation_detected is emitted.
  // The claim still proceeds to PoT verification — detection is informational,
  // not blocking. Only exact canonical form inversions are detected (assert↔negate
  // with identical domain, subject, predicate, scope); semantic violations
  // (e.g. constraint facts vs related assertions) require off-chain oracle reasoning.
  //
  // Formal Logic Brief Gap 3 (★★★☆☆). Default: false.
  bool constraint_check_enabled = 185;

  // socratic_check_enabled: when true, MsgSubmitClaim detects when the submitter
  // has an existing accepted Fact whose canonical form OPPOSES the new claim's
  // canonical form. This encodes the Socratic elenchus: a submitter is trapped by
  // their own prior commitments. The detection is informational and non-blocking.
  // Sets Claim.IsSelfContradictory and emits zerone.knowledge.socratic_self_contradiction_detected.
  //
  // Requires Params.constraint_check_enabled = true is NOT required — this is a
  // distinct check with a submitter-scope filter (only the same submitter's facts).
  //
  // Socratic Dialectic Brief Gap 1 (★★★☆☆). Default: false.
  bool socratic_check_enabled = 186;

  // suspension_enabled: when true, governance may suspend claims via MsgSuspendClaim.
  // A SUSPENDED claim is held in a Bohmian "mirror-state" — visible and queryable,
  // but no verification round may be opened on it. Suspension encodes David Bohm's
  // practice of holding assumptions visible without acting on them: "neither carry
  // them out nor suppress them." (*On Dialogue*, 1996.)
  //
  // When false (default), MsgSuspendClaim returns ErrSuspensionDisabled.
  // When true, only the governance authority address may suspend or resume claims.
  //
  // Bohm Dialogue Brief Gap 1 (★★★☆☆). Default: false.
  bool suspension_enabled = 187;

  // aporia_threshold: when > 0, a claim whose inconclusive_count reaches this
  // value is marked in_aporia. Encodes Socratic aporia — the productive
  // perplexity that emerges when the community of inquiry has genuinely
  // exhausted its instruments. The threshold is the governance-adjustable
  // point at which repeated inconclusiveness stops being noise and starts
  // being a signal about the epistemic frontier.
  //
  // 0 = disabled (no aporia marking, backward-compatible default).
  // Recommended initial value: 3–5 inconclusive rounds.
  //
  // Socratic Dialectic Gap 2 (★★★☆☆). Default: 0 (disabled).
  uint64 aporia_threshold = 188;

  // min_cross_tradition_diversity_bps: minimum cross-tradition panel diversity
  // score required for an M-PHENOMENOLOGICAL claim to be ACCEPTED. If the
  // score (distinct_tradition_count × 1_000_000 / total_verifiers) falls below
  // this threshold, an otherwise-ACCEPT verdict becomes INCONCLUSIVE.
  //
  // Fail-open: 0 = disabled (no cross-tradition gate). Empty/unknown tradition
  // on a verifier's AgentCalibration counts as a unique singleton — verifiers
  // without declared traditions are never penalised.
  //
  // Rationale: confirmation from practitioners across independent lineages
  // is stronger evidence than same-tradition consensus — the replication logic
  // from Scientific Method Gap 1 (panel_diversity_score_bps) applied to the
  // contemplative domain. Contemplative Traditions Brief Gap 4 (★★☆☆☆).
  // Default: 0 (disabled).
  uint64 min_cross_tradition_diversity_bps = 189;

  // extraordinary_claim_min_contradictions: minimum number of CONTRADICTS
  // relations in a claim's submission before it is treated as "extraordinary"
  // per Sagan's maxim. 0 = disabled (all claims use global min_verifiers).
  //
  // When a claim contradicts ≥ this many established facts, the verification
  // round's extraordinary_min_verifiers is set to:
  //   min_verifiers × extraordinary_claim_verifier_multiplier_bps / 1_000_000
  //
  // Skepticism Gap 3 (★★★★☆). Default: 0 (disabled).
  uint64 extraordinary_claim_min_contradictions = 190;

  // extraordinary_claim_verifier_multiplier_bps: the factor by which
  // min_verifiers is scaled for extraordinary claims, in 1M-BPS.
  // 2_000_000 = 2× (panel requirement doubles for high-contradiction claims).
  // Only meaningful when extraordinary_claim_min_contradictions > 0.
  // Default: 2_000_000 (2×).
  uint64 extraordinary_claim_verifier_multiplier_bps = 191;

  // research_programme_degeneration_threshold: Lakatosian degenerating-programme
  // early-warning gate (Falsificationism Gap 3). When a rescue-chain claim has
  // research_programme_depth > this threshold, the chain emits
  // zerone.knowledge.degenerating_research_programme and sets a flag on the claim.
  //
  // 0 = disabled (default). When enabled, governance sets the tolerance for
  // successive rescues before emitting the degeneration signal. A threshold of 3
  // means chains of 4+ rescues emit the warning; 3-deep chains are allowed.
  //
  // Informational only — does not block claim submission.
  // Default: 0 (disabled). Falsificationism Gap 3 (★★★☆☆).
  uint64 research_programme_degeneration_threshold = 192;

  // defeater_opposition_threshold_bps: Pollock undercutting-defeater trigger.
  // When a challenge claim is REJECTED (the original fact survives) but the
  // panel's rejection confidence (rejectionConfidenceBps) is BELOW this
  // threshold, the marginal challenge is recorded as an undercutting defeater on
  // the surviving fact (Fact.defeater_count++). This encodes Pollock's (1986)
  // epistemology: a successful but narrow-margin challenge signals that the
  // evidence connecting claim to truth is weakly supporting — the defeater
  // reduces the effective evidential support without falsifying the claim.
  //
  // Example: threshold = 600_000 (60%). A challenge is REJECTED at 58%
  // confidence → the fact survived but only by a slim margin → defeater recorded.
  // A challenge rejected at 80% confidence → strong corroboration, no defeater.
  //
  // 0 = disabled (default). All challenge survivals are corroborations only.
  // Recommended initial value: 500_000–650_000 (50–65% opposition threshold).
  // Skepticism Brief Gap 1 (★★★☆☆). Default: 0 (disabled).
  uint64 defeater_opposition_threshold_bps = 193;

  // defeater_per_count_discount_bps: per-defeater discount applied to
  // Fact.effective_confidence_bps. Each accumulated defeater reduces the
  // fact's effective confidence by this many BPS of the base confidence.
  //
  //   effective = confidence_bps × (1 − defeater_count × discount / 1_000_000)
  //   clamped to [0, confidence_bps].
  //
  // Example: base confidence = 800_000 (80%), discount = 50_000 (5%), defeaters = 3:
  //   effective = 800_000 × (1 − 3 × 50_000 / 1_000_000)
  //             = 800_000 × (1 − 0.15) = 800_000 × 0.85 = 680_000 (68%).
  //
  // 0 = no discount applied (effective_confidence_bps tracks confidence_bps exactly).
  // Only meaningful when defeater_opposition_threshold_bps > 0.
  // Skepticism Brief Gap 1. Default: 0 (disabled).
  uint64 defeater_per_count_discount_bps = 194;

  // defeater_probe_priority_min_count: minimum Fact.defeater_count that
  // promotes a fact to "priority probe" status (Skepticism Gap 2 — Defeater-
  // Aware Probe Prioritization). A fact that has accumulated this many
  // undercutting defeaters is considered epistemically stressed and is invited
  // for external probing using a reduced idle threshold
  // (defeater_probe_reduced_threshold_blocks) rather than the normal
  // probe_invitation_idle_threshold_blocks. This causes stressed facts to
  // surface in the probe queue sooner than pristine high-confidence facts.
  //
  // Pollock's insight: a fact that has survived multiple narrow-margin
  // challenges still asserts the same conclusion, but the accumulation of
  // undercutting defeaters reveals that the evidential connection is being
  // repeatedly questioned. The probe priority mechanism ensures that such
  // facts receive additional scrutiny before their effective_confidence_bps
  // decays too far to be useful.
  //
  // 0 = disabled (default). All facts use the same idle threshold regardless
  // of defeater count. Enable via governance once defeater tracking
  // (defeater_opposition_threshold_bps > 0) is active.
  // Skepticism Brief Gap 2 (★★★☆☆). Default: 0 (disabled).
  uint64 defeater_probe_priority_min_count = 195;

  // defeater_probe_reduced_threshold_blocks: the idle threshold in blocks
  // used for facts that qualify for priority probing (DefeaterCount >=
  // defeater_probe_priority_min_count). A smaller value means the fact is
  // promoted into the probe invitation queue sooner.
  //
  // 0 = halve the normal probe_invitation_idle_threshold_blocks (fast default
  // that governance can override). Non-zero = use this exact threshold.
  // Only meaningful when defeater_probe_priority_min_count > 0.
  //
  // Example: if probe_invitation_idle_threshold_blocks = 34,272 (~1 day) and
  // defeater_probe_reduced_threshold_blocks = 8,568 (~6 hours), then a fact
  // with 2+ defeaters will be invited for probing after only 6 hours of
  // inactivity instead of the normal 24-hour wait.
  //
  // Skepticism Brief Gap 2. Default: 0 (halve the normal threshold).
  uint64 defeater_probe_reduced_threshold_blocks = 196;

  // ── Structured Deliberation Gap 4: Polis Bridging ────────────────────────
  //
  // bridging_min_orgs: minimum number of distinct organizations among ACCEPT
  // voters required to emit a zerone.knowledge.bridging_claim_accepted event.
  // 0 = disabled (default). 2 = at least two distinct orgs both voted ACCEPT.
  //
  // Polis's core insight: cross-organizational consensus is stronger signal
  // than within-cluster agreement. This parameter gates when the chain
  // flags a fact as a "bridging claim" in the Polis sense.
  //
  // Note: bridging_org_count is always computed and stored on every accepted
  // fact, regardless of this parameter. The parameter only controls event
  // emission threshold. Set to 0 to compute silently.
  uint64 bridging_min_orgs = 197;

  // high_bayesian_update_threshold_bps: minimum bayesian_update_magnitude_bps
  // that triggers a zerone.knowledge.high_bayesian_update event.
  // 0 = disabled (default). 500_000 = flag facts where evidence moved the
  // needle by ≥ 50% of the BPS range (a significant epistemic surprise).
  //
  // bayesian_update_magnitude_bps is always computed and stored on every
  // accepted fact that had a stated prior, regardless of this threshold.
  // This parameter only gates the event emission.
  uint64 high_bayesian_update_threshold_bps = 198;

  // regress_depth_probe_threshold: minimum AxiomDistance for a fact to be
  // treated as "deep-lineage" and receive accelerated probe invitations.
  // 0 = disabled (default) — all facts use the same idle threshold regardless
  // of how far they sit from axioms.
  //
  // When > 0, facts with AxiomDistance >= this value use
  // regress_depth_probe_reduced_threshold_blocks (or half the normal idle
  // threshold when that param is 0) as their effective idle threshold.
  // Epistemological rationale: deeper derivation chains have more potential
  // failure points (Doubt Provenance / Regress Tracking, Skepticism Brief §5.4).
  // Facts far from axioms should be stress-tested more frequently than axiom-
  // proximal facts.
  uint64 regress_depth_probe_threshold = 199;

  // regress_depth_probe_reduced_threshold_blocks: the reduced idle threshold
  // applied to deep-lineage facts (AxiomDistance >= regress_depth_probe_threshold).
  // 0 = halve the normal ProbeInvitationIdleThresholdBlocks (default).
  // Set explicitly to override the halving with a governance-controlled value.
  // Only meaningful when regress_depth_probe_threshold > 0.
  uint64 regress_depth_probe_reduced_threshold_blocks = 200;

  // ─── Skepticism Gap 5: Rebutting Defeater Tracking ───────────────────────
  //
  // rebutting_defeater_discount_bps: per-rebutting-defeater discount applied to
  // a fact's EffectiveConfidenceBps when a direct on-chain contradiction is
  // accepted by the verification panel.
  //
  // A rebutting defeater (Pollock, 1986) DIRECTLY CONTRADICTS a belief, as
  // opposed to an undercutting defeater which attacks evidential support.
  // When a contradicting claim (RELATION_TYPE_CONTRADICTS → target fact) is
  // ACCEPTED, the target fact's epistemic standing should be reduced more
  // aggressively than from an undercutting defeater.
  //
  // EffectiveConfidenceBps formula (combined undercutting + rebutting):
  //   total_discount = (defeater_count × defeater_per_count_discount_bps
  //                   + rebutting_defeater_count × rebutting_defeater_discount_bps)
  //   effective = confidence × max(0, BPS − total_discount) / BPS
  //
  // Default: 0 (disabled). When 0, rebutting defeaters do not reduce
  // effective_confidence_bps. Activate by governance proposal.
  uint64 rebutting_defeater_discount_bps = 201;

  // ─── Phenomenology Gap: Reduction Steps ──────────────────────────────────
  //
  // min_phenomenological_reduction_steps: minimum number of explicit
  // ReductionStep records required before an M-PHENOMENOLOGICAL claim can
  // receive an ACCEPT verdict. When this param > 0 and the claim has fewer
  // steps, CompleteRound returns INCONCLUSIVE instead of ACCEPT.
  //
  // Encodes Husserl's methodological requirement: phenomenology is a
  // discipline of explicit reduction, not mere introspection. A claim
  // without recorded reduction steps has no verifiable phenomenological
  // provenance — the verifier panel cannot assess whether the practitioner
  // actually performed the epoché, the eidetic reduction, and so forth.
  //
  // Default: 0 (disabled — all M-PHENOMENOLOGICAL claims pass unconditionally).
  // Governance activates by setting to 1 or higher.
  // Fail-open: non-M-PHENOMENOLOGICAL claims are never gated by this param.
  uint64 min_phenomenological_reduction_steps = 202;
}

// GenesisState is the genesis state of the knowledge module.
message GenesisState {
  Params                    params        = 1;
  repeated Fact             facts         = 2;
  repeated Claim            pending_claims = 3;
  repeated VerificationRound active_rounds = 4;
  repeated Domain           domains       = 5;
  string bootstrap_fund_allocation                 = 6; // Initial fund allocation (uzrn) — one-time genesis mint
  repeated CommonKnowledgeEntry common_knowledge   = 7; // Seeded common knowledge entries

  // ─── Route B Wave 8: full state round-trip ─────────────────────────────
  // Every type the Route B training infrastructure writes is exported here
  // so a chain upgrade (or genesis restart) preserves the substrate. The
  // alignment principle: the chain is survivable — past manifests,
  // attestations, calibrations, and disbursements outlive any single run.

  repeated Methodology          methodologies          = 20;
  repeated NormativeCommitment  normative_commitments  = 21;

  TokenizerSpec                 tokenizer_spec         = 30; // current
  repeated TokenizerSpec        tokenizer_spec_history = 31; // historical versions
  TraceSchema                   trace_schema           = 32; // current
  repeated TraceSchema          trace_schema_history   = 33; // historical versions

  repeated TrainingPipeline     training_pipelines     = 40;
  repeated ModelCard            model_cards            = 41;
  repeated TrainingAttestation  training_attestations  = 42;
  repeated ContributionRecord   contribution_records   = 43;
  repeated AugmentationBounty   augmentation_bounties  = 44;
  repeated Augmentation         augmentations          = 45;
  repeated ContributionChallenge contribution_challenges = 46;
  repeated TrainingFundDisbursement training_fund_disbursements = 47;
  repeated TrainingManifest     training_manifests     = 48;

  // Agent calibration (Phase 5) — also Route-B-adjacent.
  repeated AgentCalibration     agent_calibrations     = 50;

  // Scientific Method Gap 3: pre-registrations for state round-trip.
  // Unfulfilled pre-registrations with active bonds must survive chain restarts.
  repeated PreRegistration      pre_registrations      = 55;

  // Training fund initial balance (uzrn, minted on InitGenesis; analogous
  // to bootstrap_fund_allocation but for the KnowledgeTrainingFund module
  // account).
  string training_fund_allocation                      = 60;
}

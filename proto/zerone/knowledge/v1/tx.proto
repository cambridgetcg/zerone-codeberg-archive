// ─── Route B Wave 13: surgical state corrections ─────────────────────────

message MsgCorrectManifestMerkleRoot {
  option (cosmos.msg.v1.signer) = "authority";

  string authority      = 1;
  string manifest_id    = 2;
  // Required: the incident_id this correction is recorded under. A
  // correction without an open incident is rejected so no authority-gated
  // state edit can happen without an audit trail.
  string incident_id    = 3;
  // Optional caller-provided expected root. When set, the handler asserts
  // the recomputed root matches — prevents the handler from silently
  // overwriting a NON-corrupted manifest due to an operator error.
  string expected_recomputed_root = 4;
  string note           = 5;
}
message MsgCorrectManifestMerkleRootResponse {
  string prior_root        = 1;  // what was there before correction
  string recomputed_root   = 2;  // what the handler wrote
  bool   was_corrupted     = 3;  // true iff prior != recomputed (else no-op)
}

// MsgVetoFactInjection — a registered guardian cancels a pending
// authority-injected fact during the veto window. The fact never
// materializes; the privileged-action log records the veto for audit.
message MsgVetoFactInjection {
  option (cosmos.msg.v1.signer) = "guardian";

  string guardian   = 1;  // must appear in Params.guardian_addresses
  string pending_id = 2;  // the PendingFactInjection.id to cancel
  string reason     = 3;  // free-form audit comment
}
message MsgVetoFactInjectionResponse {}

// MsgAddConsequenceInstance — attaches a pragmatic consequence instance to an
// M-PRAGMATIC claim. Any address may submit. The claim must exist and must not
// be in CLAIM_STATUS_REJECTED status. The context_description, predicted_outcome,
// and observed_outcome fields are required; evidence_hash is optional.
// Operationalizes Peirce's track-record requirement for pragmatic truth.
message MsgAddConsequenceInstance {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter           = 1;
  string claim_id            = 2;
  string context_description = 3;  // required: the situation tested
  string predicted_outcome   = 4;  // required: what the claim predicted
  string observed_outcome    = 5;  // required: what actually happened
  string evidence_hash       = 6;  // optional: SHA-256 hex of off-chain evidence
}
message MsgAddConsequenceInstanceResponse {
  uint64 instance_count = 1;  // total consequence instances after addition
}

// ─── Scientific Method Gap 1: Verifier Independence ──────────────────────────
//
// MsgSetVerifierOrganization declares or updates the organizational affiliation
// of a verifier address. Enables panel_diversity_score_bps computation at
// CompleteRound. Self-declaration allowed for one's own address; authority can
// override any address (for bootstrapping or correcting misrepresentation).
//
// organization_id is a free-form string — governance defines the registry of
// recognized organizations separately. Empty string CLEARS the affiliation.
message MsgSetVerifierOrganization {
  option (cosmos.msg.v1.signer) = "sender";

  string sender           = 1;  // self-declaration: must match verifier, OR be governance authority
  string verifier_address = 2;  // target verifier whose affiliation is being set
  string organization_id  = 3;  // new organization_id; empty = clear affiliation
  string rationale        = 4;  // required for authority overrides; optional for self-declaration
}

message MsgSetVerifierOrganizationResponse {
  string verifier_address = 1;
  string organization_id  = 2;  // the organization_id that was stored
}

// ─── Scientific Method Gap 2: Methodology Governance ─────────────────────────
//
// MsgUpdateMethodology amends an existing methodology definition. The caller
// supplies the COMPLETE desired methodology state; the handler auto-manages
// version (current+1) and ratified_at_block (current chain height). The
// methodology.id must match an existing registry entry — this message cannot
// create new methodologies (creation is genesis-only). is_transitional may
// be set to retire a methodology under the M-LEGACY sunset path.
//
// Authority-gated: requires the module's governance authority address.
message MsgUpdateMethodology {
  option (cosmos.msg.v1.signer) = "authority";

  string authority             = 1;  // governance authority address
  Methodology methodology      = 2;  // complete new state; version + ratified_at_block auto-assigned
  string rationale             = 3;  // required human-readable reason; stored in the privileged-action log
}

// MsgUpdateMethodologyResponse returns the auto-assigned version and the id,
// so the governance proposal execution result is self-documenting.
message MsgUpdateMethodologyResponse {
  string methodology_id = 1;
  uint64 new_version    = 2;
}

// ─── Scientific Method Gap 3: Submission Bias / Pre-registration ──────────────
//
// MsgPreRegisterClaim anchors a claim intent on-chain BEFORE evidence collection.
// The pre-registration creates an unforgeable timestamp proving the hypothesis
// existed prior to the data being gathered. When MsgSubmitClaim later references
// this pre-registration, the claim is tagged as pre-registered and eligible for
// a review fee discount (incentivizing epistemic honesty over p-hacking).
//
// Bond mechanics (when Params.pre_registration_bond_uzrn > 0):
//   - Bond escrowed from submitter to knowledge module on MsgPreRegisterClaim
//   - Bond returned to submitter when MsgSubmitClaim fulfills the pre-registration
//   - Bond forfeited to research_fund if the pre-registration expires unfulfilled
//
// Expiry (when Params.pre_registration_expiry_blocks > 0):
//   - Pre-registration expires at created_at_block + expiry_blocks
//   - Expiry is checked in BeginBlocker; unfulfilled expired records are processed
message MsgPreRegisterClaim {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter      = 1;  // address of the submitter
  // claim_intent: free-form description of the intended claim. This is the
  // hypothesis as declared before evidence collection — the temporal anchor.
  // Should be specific enough to demonstrate that the submitted claim matches
  // the declared intent (prevents gaming by pre-registering vague intents).
  string claim_intent   = 2;
  // methodology_id: the methodology under which the claim will be submitted.
  // Must be a valid, non-retired methodology in the governance registry.
  string methodology_id = 3;
  // domain: the domain into which the claim will be submitted.
  string domain         = 4;
}

message MsgPreRegisterClaimResponse {
  string pre_registration_id = 1;
  uint64 expiry_block        = 2;  // 0 if no expiry configured
  string bond_amount         = 3;  // "0" if no bond required
}

// MsgSetAttentionalPractice declares or updates a verifier's formal contemplative
// or phenomenological practice hours. Used to qualify for M-PHENOMENOLOGICAL panels
// when Params.min_phenomenological_practice_hours is set.
//
// Authorization:
//   - Self-declaration: sender == verifier_address (anyone may declare their own hours)
//   - Authority override: sender == governance authority (requires rationale)
//
// Self-declaration is unverified but creates an on-chain record that can be
// audited and disputed via governance. Authority override marks the record as
// governance-confirmed by setting attentional_practice_verified_by.
message MsgSetAttentionalPractice {
  string sender           = 1; // tx signer
  string verifier_address = 2; // verifier whose practice is being declared
  uint64 practice_hours   = 3; // total hours of formal contemplative practice
  string rationale        = 4; // required for authority override; optional for self-declaration
}

message MsgSetAttentionalPracticeResponse {
  string verifier_address = 1;
  uint64 practice_hours   = 2;
  bool   verified         = 3; // true when set by governance authority, false for self-declaration
}

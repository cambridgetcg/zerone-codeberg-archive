syntax = "proto3";
package zerone.disputes.v1;
option go_package = "github.com/zerone-chain/zerone/x/disputes/types";

import "cosmos/msg/v1/msg.proto";
import "zerone/disputes/v1/types.proto";
import "zerone/disputes/v1/genesis.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc InitiateDispute(MsgInitiateDispute) returns (MsgInitiateDisputeResponse);
  rpc CommitEvidence(MsgCommitEvidence) returns (MsgCommitEvidenceResponse);
  rpc RevealEvidence(MsgRevealEvidence) returns (MsgRevealEvidenceResponse);
  rpc ArbiterVote(MsgArbiterVote) returns (MsgArbiterVoteResponse);
  rpc EscalateDispute(MsgEscalateDispute) returns (MsgEscalateDisputeResponse);
  rpc SettleDispute(MsgSettleDispute) returns (MsgSettleDisputeResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc DefendDispute(MsgDefendDispute) returns (MsgDefendDisputeResponse);

  // Appeal RPC
  rpc AppealDispute(MsgAppealDispute) returns (MsgAppealDisputeResponse);

  // Service Escrow RPCs
  rpc CreateServiceEscrow(MsgCreateServiceEscrow) returns (MsgCreateServiceEscrowResponse);
  rpc CompleteServiceEscrow(MsgCompleteServiceEscrow) returns (MsgCompleteServiceEscrowResponse);
  rpc DisputeServiceEscrow(MsgDisputeServiceEscrow) returns (MsgDisputeServiceEscrowResponse);
}

message MsgInitiateDispute {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  DisputeTargetType target_type = 2;
  string target_id = 3;
  string reason = 4;
  string bond = 5;
}
message MsgInitiateDisputeResponse { string dispute_id = 1; }

message MsgCommitEvidence {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string dispute_id = 2;
  string commitment_hash = 3;
}
message MsgCommitEvidenceResponse {}

message MsgRevealEvidence {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string dispute_id = 2;
  string content = 3;
  string nonce = 4;
}
message MsgRevealEvidenceResponse {}

message MsgArbiterVote {
  option (cosmos.msg.v1.signer) = "arbiter";
  string arbiter = 1;
  string dispute_id = 2;
  ArbiterDecision vote = 3;
  string reasoning = 4;
}
message MsgArbiterVoteResponse {}

message MsgEscalateDispute {
  option (cosmos.msg.v1.signer) = "requester";
  string requester = 1;
  string dispute_id = 2;
  string additional_bond = 3;
}
message MsgEscalateDisputeResponse { uint32 new_tier = 1; }

message MsgSettleDispute {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string dispute_id = 2;
}
message MsgSettleDisputeResponse { DisputeOutcome outcome = 1; }

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params    = 2;
}
message MsgUpdateParamsResponse {}

// MsgDefendDispute allows the defender to post a symmetric bond during EVIDENCE_COMMIT phase,
// enabling two-bond settlement math (loser's bond slashed, not just the challenger's).
// Optional: if never called, the dispute proceeds in single-bond mode (backward compatible).
message MsgDefendDispute {
  option (cosmos.msg.v1.signer) = "defender";
  string defender   = 1;
  string dispute_id = 2;
  string bond       = 3;   // uzrn amount; must be >= tier MinBond
}
message MsgDefendDisputeResponse {}

// MsgAppealDispute files an appeal against a settled verdict during the appeal window.
// Only the challenger or defender may appeal, and only once per dispute.
// The appealer must post appeal_bond = original_bond × AppealBondMultiplierBps / 1_000_000.
// A higher-tier arbiter panel is convened; if the verdict is reversed, the appeal bond is
// returned to the appealer and the new outcome is executed. If confirmed, the appeal bond
// goes to the original winning party.
message MsgAppealDispute {
  option (cosmos.msg.v1.signer) = "appealer";
  string appealer   = 1;
  string dispute_id = 2;
  string appeal_bond = 3;  // uzrn; must be >= original_bond × AppealBondMultiplierBps / 1_000_000
}
message MsgAppealDisputeResponse {}

// MsgCreateServiceEscrow locks payer funds in the disputes module account.
message MsgCreateServiceEscrow {
  option (cosmos.msg.v1.signer) = "payer";
  string payer      = 1;
  string provider   = 2;
  string amount     = 3;   // uzrn to lock
  string terms_hash = 4;   // SHA256 of off-chain agreement
  uint64 deadline   = 5;   // absolute block height deadline
}
message MsgCreateServiceEscrowResponse { string escrow_id = 1; }

// MsgCompleteServiceEscrow is submitted by the provider when the service is done.
// On success, funds are released from the module account to the provider immediately.
// The payer has escrow_dispute_window_blocks to raise a dispute.
message MsgCompleteServiceEscrow {
  option (cosmos.msg.v1.signer) = "provider";
  string provider   = 1;
  string escrow_id  = 2;
  string proof_hash = 3;   // SHA256 of delivery proof
}
message MsgCompleteServiceEscrowResponse {}

// MsgDisputeServiceEscrow is submitted by the payer within the dispute window
// after CompleteServiceEscrow. Transitions status to DISPUTED; funds remain
// in the module account pending governance / arbiter resolution.
message MsgDisputeServiceEscrow {
  option (cosmos.msg.v1.signer) = "payer";
  string payer     = 1;
  string escrow_id = 2;
  string reason    = 3;
}
message MsgDisputeServiceEscrowResponse {}

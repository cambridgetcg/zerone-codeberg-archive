syntax = "proto3";
package zerone.disputes.v1;
option go_package = "github.com/zerone-chain/zerone/x/disputes/types";

import "zerone/disputes/v1/types.proto";

message GenesisState {
  Params params = 1;
  repeated Dispute disputes = 2;
  repeated DisputerProfile disputer_profiles = 3;  // reputation history export/import
}

message Params {
  repeated TierConfig tier_configs = 1;  // 4 tiers
  uint32 max_active_disputes = 2;        // default: 100
  uint64 escalation_delay = 3;           // default: 500 blocks
  uint64 slash_rate_loser_bps = 4;       // default: 500000 (50% of bond)
  uint64 reward_rate_winner_bps = 5;     // default: 400000 (40% of loser's slash)
  uint64 arbiter_reward_bps = 6;         // default: 100000 (10% of loser's slash)
  // escrow_dispute_window_blocks: blocks after CompleteServiceEscrow during which
  // the payer may call DisputeServiceEscrow. After this window the escrow is
  // considered finalised (funds already released to provider at completion).
  uint64 escrow_dispute_window_blocks = 7; // default: 250 (~10 minutes at 2.5s/block)
  // max_leverage_bps: maximum ratio of total locked collateral to spendable balance,
  // expressed in basis points (1_000_000 = 100%). An agent cannot lock more than
  // max_leverage_bps / 1_000_000 of their balance across all active disputes.
  // Default 0 = disabled (no leverage limit enforced).
  uint64 max_leverage_bps = 8; // default: 0 (disabled)

  // ── Gap 5: Reputation-Adjusted Bond Requirements ──────────────────────────
  //
  // Challengers with a proven track record pay a reduced minimum bond;
  // challengers with a poor track record pay an increased minimum bond.
  // All reputation params are inactive when reputation_min_rounds == 0 (default).

  // reputation_min_rounds: minimum number of closed disputes before the
  // reputation adjustment applies. Protects new challengers from being gated.
  // Default 0 = reputation system disabled.
  uint64 reputation_min_rounds = 9;

  // reputation_high_threshold_bps: win rate (1M scale) above which the
  // discount applies. Default 800_000 (80%).
  uint64 reputation_high_threshold_bps = 10;

  // reputation_low_threshold_bps: win rate (1M scale) below which the
  // penalty applies. Default 200_000 (20%).
  uint64 reputation_low_threshold_bps = 11;

  // reputation_discount_bps: fraction of the tier minimum bond removed for
  // high-reputation challengers. E.g. 200_000 = 20% discount.
  // Effective min bond = tier_min × (1_000_000 - discount) / 1_000_000.
  uint64 reputation_discount_bps = 12;

  // reputation_penalty_multiplier_bps: multiplier applied to the tier minimum
  // bond for low-reputation challengers. E.g. 2_000_000 = 200% (double bond).
  // Effective min bond = tier_min × multiplier / 1_000_000.
  uint64 reputation_penalty_multiplier_bps = 13;
}

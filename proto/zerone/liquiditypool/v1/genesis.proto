syntax = "proto3";
package zerone.liquiditypool.v1;

option go_package = "github.com/zerone-chain/zerone/x/liquiditypool/types";

import "zerone/liquiditypool/v1/types.proto";

// Params defines the liquiditypool module parameters.
message Params {
  uint64 default_swap_fee_bps  = 1; // default swap fee (1M bps scale)
  uint64 max_pools             = 2; // maximum number of active pools
  string min_initial_liquidity = 3; // minimum per-side liquidity in base units (bigint string)
  uint64 twap_window_blocks    = 4; // default TWAP window in blocks
  uint64 protocol_fee_bps      = 5; // protocol's share of swap fees (1M bps scale)
  string min_reserve           = 6; // minimum reserve after swap (bigint string, default "1")
  uint64 max_swap_fraction_bps       = 7; // maximum fraction of pool reserve swappable in one tx (1M bps scale, 0 = disabled)
  uint64 commit_reveal_delay_blocks  = 8; // minimum blocks between CommitSwap and RevealSwap (0 = commit-reveal disabled)
  uint64 min_liquidity_duration_blocks = 9; // minimum blocks LP must hold before withdrawing (0 = disabled, anti-JIT)
  uint64 max_twap_deviation_bps = 10; // max spot/TWAP price deviation before swaps are blocked (1M bps scale, 0 = disabled)

  // mev_fee_share_bps: fraction of RevealSwap priority tips allocated to the pool's LP
  // MEV reserve (1M bps scale). 0 = tips go entirely to protocol (disabled / default).
  // 1,000,000 = all tips become LP revenue. Valid range: 0 – 1,000,000.
  // Market Microstructure Gap 3.
  uint64 mev_fee_share_bps = 11;

  // fair_sequencing_enabled: when true, RevealSwap queues the validated swap
  // for EndBlocker processing instead of executing immediately.  All queued
  // reveals in a block are processed in CommitBlock-ascending order (FIFO),
  // removing the validator's ability to profit by reordering swaps.
  // Default: false (RevealSwap executes immediately — no behaviour change).
  // Market Microstructure Gap 5.
  bool fair_sequencing_enabled = 12;
}

// GenesisState defines the liquiditypool module genesis state.
message GenesisState {
  Params params                                      = 1;
  repeated Pool pools                                = 2;
  repeated TWAPAccumulator twap_accumulators         = 3;
  repeated LiquidityMiningPeriod mining_periods      = 4;
  repeated LpMinerPosition miner_positions           = 5;
  repeated SwapCommitment swap_commitments           = 6; // pending commit-reveal commitments
  repeated PendingSwapReveal pending_swap_reveals    = 7; // queued for fair-sequencing EndBlocker
}

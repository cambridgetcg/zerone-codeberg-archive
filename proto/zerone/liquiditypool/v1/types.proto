syntax = "proto3";
package zerone.liquiditypool.v1;

option go_package = "github.com/zerone-chain/zerone/x/liquiditypool/types";

// Pool represents a constant-product AMM liquidity pool.
message Pool {
  string pool_id         = 1;
  string denom_a         = 2;
  string denom_b         = 3;
  string reserve_a       = 4;  // bigint string
  string reserve_b       = 5;  // bigint string
  uint64 swap_fee_bps    = 6;  // 1M bps scale (1,000,000 = 100%)
  string lp_token_supply = 7;  // bigint string
  string lp_denom        = 8;  // "lp/{pool_id}"
  string creator         = 9;
  uint64 created_at_block = 10;
  bool   locked          = 11; // reentrancy guard
  // Liquidity mining: cumulative reward per LP token (×1e18 precision, bigint string).
  // Monotonically increasing. Default "" treated as "0".
  string accumulated_reward_per_lp = 12;

  // pool_max_swap_fraction_bps: per-pool override for the global MaxSwapFractionBps
  // governance parameter (Market Microstructure Gap 4). When non-zero this value
  // governs the maximum fraction of the pool's input-token reserve that a single
  // swap may consume, expressed in BPS (1,000,000 = 100%).
  //
  // Precedence: pool-level (this field, if > 0) > global Params.MaxSwapFractionBps.
  // A pool-level value of 0 means "use the global default" — backward compatible.
  // Valid range: 1 – 1,000,000 (enforced at CreatePool).
  uint64 pool_max_swap_fraction_bps = 13;

  // mev_reserve_balance: per-pool MEV priority-tip LP reserve in uzrn (bigint string).
  // Accumulates the LP fraction of RevealSwap priority tips (Params.mev_fee_share_bps).
  // Pro-rata distributed to LPs on RemoveLiquidity (proportional to LP tokens burned).
  // "" or "0" = no reserve (backward compatible — all pre-Gap-3 pools have 0).
  string mev_reserve_balance = 14;
}

// LiquidityMiningPeriod defines a per-pool emission schedule for LP reward distribution.
// One active period per pool. Governance creates; BeginBlocker accumulates.
message LiquidityMiningPeriod {
  string id               = 1;
  string pool_id          = 2;
  string amount_per_block = 3; // uzrn bigint string minted per block
  uint64 start_block      = 4;
  uint64 end_block        = 5;
  bool   active           = 6;
  string total_mined      = 7; // bigint string, cumulative uzrn minted
  string creator          = 8; // governance authority
}

// LpMinerPosition tracks a user's liquidity mining reward state for a pool.
// Key: (pool_id, miner_addr). Created lazily on first AddLiquidity/Claim.
message LpMinerPosition {
  string pool_id        = 1;
  string miner_addr     = 2;
  // reward_debt is the pool's accumulated_reward_per_lp at the last settlement (×1e18, bigint).
  // pending = (current_acc - reward_debt) × lp_balance / 1e18
  string reward_debt    = 3;
  // settled but unclaimed uzrn (bigint string)
  string pending_rewards = 4;
}

// TWAPAccumulator stores cumulative price data for TWAP oracle.
// One record per pool, O(1) updates.
message TWAPAccumulator {
  string pool_id         = 1;
  uint64 last_block      = 2;
  string cum_price_a_to_b = 3; // bigint string (1e12 scale)
  string cum_price_b_to_a = 4; // bigint string (1e12 scale)
}

// SwapResult contains the output of a swap calculation.
message SwapResult {
  string token_out_denom  = 1;
  string token_out_amount = 2; // bigint string
  string fee_amount       = 3; // bigint string
  uint64 price_impact_bps = 4; // 1M bps scale
}

// SwapCommitment stores a pending commit-reveal swap commitment.
// Key: SwapCommitmentKeyPrefix + sender + "/" + pool_id.
// One commitment per (sender, pool_id) at a time; overwriting is allowed.
message SwapCommitment {
  string sender       = 1;
  string pool_id      = 2;
  // sha256(nonce || "|" || pool_id || "|" || token_in_denom || "|" ||
  //         token_in_amount || "|" || min_token_out || "|" || deadline_block_decimal)
  // nonce is length-prefixed (4-byte big-endian uint32) to prevent preimage collision.
  bytes  commitment   = 3;
  uint64 commit_block = 4; // block height at which commit was recorded
}

// PendingSwapReveal queues a validated swap reveal for fair sequencing.
// When Params.fair_sequencing_enabled is true, RevealSwap stores the swap
// parameters here instead of executing immediately.  EndBlocker processes
// all pending reveals in CommitBlock-ascending order (FIFO), removing the
// validator's ability to profit by reordering AMM transactions within a block.
//
// Key: PendingSwapRevealKeyPrefix + big-endian(commit_block, 8 bytes)
//      + sender + "/" + pool_id
// The big-endian commit_block prefix gives lexicographic == chronological order.
message PendingSwapReveal {
  string sender            = 1;
  string pool_id           = 2;
  string token_in_denom    = 3;
  string token_in_amount   = 4; // bigint string
  string min_token_out     = 5; // bigint string, "" or "0" = no minimum
  uint64 deadline_block    = 6; // 0 = no deadline
  uint64 commit_block      = 7; // sort key — earlier commits execute first
  string priority_tip_uzrn = 8; // MEV priority tip (Gap 3), "" or "0" = none
}
